services:
  postgres:
    image: postgres:16-alpine
    container_name: painel_parnaiba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: painel_parnaiba
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel_parnaiba"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: painel_parnaiba_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
