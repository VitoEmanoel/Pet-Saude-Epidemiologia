services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pet_saude}?schema=public
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}"
    volumes:
      # O2: arquivos brutos das coletas sobrevivem à recriação do container.
      - backend_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - painel_network

  frontend:
    build:
      context: .
      target: frontend-runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - painel_network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pet_saude}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - painel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pet_saude}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sync-data:
    build:
      context: .
      target: backend
    profiles:
      - manual
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pet_saude}?schema=public
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: node backend/dist/scripts/sync-data.js
    # Usa a imagem do backend, mas não sobe a API: a checagem de saúde não se aplica.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - painel_network

volumes:
  postgres_data:
  backend_storage:

networks:
  painel_network:
    driver: bridge
